[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudscope"
version = "0.1.0"
description = "Read-only cloud compute inventory"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "sqlalchemy>=2,<3",
    "alembic>=1,<2",
    "psycopg[binary]>=3,<4",
    "boto3>=1,<2",
    "alibabacloud-ecs20140526>=4,<8",
    "alibabacloud-sts20150401>=1,<2",
    "alibabacloud-vpc20160428>=6,<8",
    "argon2-cffi>=23,<26",
    "pyotp>=2,<3",
    "cryptography>=43",
    "typer>=0.12,<1",
]

[project.scripts]
cloudscope = "cloudscope.cli:app"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "moto[ec2,sts]>=5,<6",
    "ruff>=0.9,<1",
    "mypy>=1,<2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["cloudscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
