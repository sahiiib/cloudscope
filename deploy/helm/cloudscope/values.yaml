image:
  backend: {repository: ghcr.io/sahiiib/cloudscope-backend, tag: ""}
  web: {repository: ghcr.io/sahiiib/cloudscope-web, tag: ""}
imagePullSecrets: []
existingSecret: cloudscope
secrets:
  create: false
  data: {}
accounts: []
accountCredentials:
  enabled: false
  namespace: cloudscope-credentials
  # Explicit /32 API-server addresses; include Service and endpoint addresses
  # as required by the cluster CNI's DNAT handling. No broad private CIDRs.
  apiServerCIDRs: []
  # Kubeadm with post-DNAT Calico/Cilium policies: use the control-plane node
  # endpoint, e.g. apiServerCIDRs: ["10.0.0.1/32"], apiServerPort: 6443.
  # Port 443 is for CNIs evaluating the Kubernetes Service before DNAT.
  apiServerPort: 443
  # Explicit external/private database CIDRs when postgres.enabled=false.
  databaseCIDRs: []
  # Additional operator-reviewed egress, e.g. private STS or Pod Identity endpoints.
  extraEgress: []
api:
  replicas: 2
  # Replace with the web/ingress pod CIDRs. Never use '*'.
  forwardedAllowIPs: "127.0.0.1"
  cookieSecure: true
web:
  replicas: 2
collector:
  schedule: "*/15 * * * *"
  concurrency: 8
  suspend: false
  loadBalancersEnabled: false
postgres:
  enabled: true
  image: postgres:16
  user: cloudscope
  database: cloudscope
  storageClass: ""
  size: 10Gi
serviceAccount:
  name: cloudscope
  annotations: {}
ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: cloudscope.local
  tls: []
networkPolicy:
  enabled: true
resources:
  api: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 512Mi}}
  web: {requests: {cpu: 50m, memory: 32Mi}, limits: {memory: 128Mi}}
  collector: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 1Gi}}
  migrate: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 512Mi}}
  postgres: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 1Gi}}
