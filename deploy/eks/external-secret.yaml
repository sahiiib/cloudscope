# Requires External Secrets Operator with external-secrets.io/v1 CRDs.
# Apply independently BEFORE Helm; the pre-install migration needs the Secret.
# ESO's controller uses its own EKS Pod Identity association, never cloudscope-hub.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: cloudscope-aws
  namespace: cloudscope
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1 # replace with the secret's region
      # No auth/serviceAccountRef: use the ESO controller's Pod Identity credentials.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudscope
  namespace: cloudscope
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cloudscope-aws
    kind: SecretStore
  target:
    name: cloudscope
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: cloudscope/prod
        property: DATABASE_URL
    - secretKey: SECRET_KEY
      remoteRef:
        key: cloudscope/prod
        property: SECRET_KEY
    - secretKey: ALIBABA_CLOUD_ACCESS_KEY_ID
      remoteRef:
        key: cloudscope/prod
        property: ALIBABA_CLOUD_ACCESS_KEY_ID
    - secretKey: ALIBABA_CLOUD_ACCESS_KEY_SECRET
      remoteRef:
        key: cloudscope/prod
        property: ALIBABA_CLOUD_ACCESS_KEY_SECRET
