services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cloudscope
      POSTGRES_PASSWORD: cloudscope
      POSTGRES_DB: cloudscope
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudscope -d cloudscope"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  postgres_data:
