name: CloudFormation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cfn-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx --from cfn-lint==1.57.2 cfn-lint deploy/aws/hub-role.yaml deploy/aws/readonly-role.yaml
