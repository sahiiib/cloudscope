name: Helm
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - uses: astral-sh/setup-uv@v6
      - run: helm lint deploy/helm/cloudscope
      - run: helm template cloudscope deploy/helm/cloudscope > /tmp/cloudscope.yaml
      - working-directory: backend
        run: uv run --frozen pytest tests/test_helm_chart.py
