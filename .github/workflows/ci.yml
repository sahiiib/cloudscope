name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - id: present
        working-directory: .
        run: echo "ok=$([ -f backend/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.ok == 'true'
        uses: astral-sh/setup-uv@v6
      - if: steps.present.outputs.ok == 'true'
        run: uv python install 3.12
      - if: steps.present.outputs.ok == 'true'
        run: uv sync
      - if: steps.present.outputs.ok == 'true'
        run: uv run ruff check .
      - if: steps.present.outputs.ok == 'true'
        run: uv run ruff format --check .
      - if: steps.present.outputs.ok == 'true'
        run: uv run mypy cloudscope
      - if: steps.present.outputs.ok == 'true'
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - id: present
        working-directory: .
        run: echo "ok=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.present.outputs.ok == 'true'
        run: npm ci
      - if: steps.present.outputs.ok == 'true'
        run: npm run lint
      - if: steps.present.outputs.ok == 'true'
        run: npx tsc --noEmit
      - if: steps.present.outputs.ok == 'true'
        run: npm test -- --run
      - if: steps.present.outputs.ok == 'true'
        run: npm run build
